<!DOCTYPE html>
<html>
    <head>
        <title>position Practice</title>

    </head>
    <body  style="
                  height: 3000px;
                  padding-left:  80px; 
    
    ">
        <div style="background-color: black;
                    color:white;
                    position:fixed;
                    top: 20px;      
                    left: 50px; 
                    right: 50px; 
        
        ">header</div>
        <div style="
                background-color: green;
                color: white;
                position: fixed;
                left: 0px;
                bottom: 0px;
                top: 50px;
                width: 72px;

        
        
        
        ">sidebar</div>
        <div style="
            position: absolute;
            background-color: red;
            color: white;
            left: 10px;
            top: 10px;
    
    
    ">absolute</div>
        
        <div style="background-color: lightblue;
                    height: 200px;
                    width: 200px;
                    position: static;
                    margin-top: 60px;
        
        
        ">div 1</div>
        <div style="background-color: lightcoral;
                    height: 200px;
                    width: 200px;
        
        
        ">div 2</div>

    </body>
</html>
