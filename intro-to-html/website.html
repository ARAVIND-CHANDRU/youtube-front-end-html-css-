<!DOCTYPE html>
<html>
  <head>
    <title>First Website</title>
  </head>
  <body>
    <!--tags are used to represent html elements for opening and closing the elements-->

<!--elements are nothing but the parameters used in web page like button,p etc..-->


<button>
  Login
</button>     <!--used to create a button in webpage -->

<p>
  Content of my webpage is yet to be updated!!!
</p>   <!--for filling paragrapghs -->


<!--to create a link which directs to another webpage (like a link in google) we use <a> anchor tag-->

<a href="https://www.instagram.com/">
    link to instagram(same_page)
</a>

<!--here href is an attribute-->
<!--an attribute modifies how an element behaves -->
<!--href : hyper link reference-->
<!--in the above command the webpage opens in the same page to open in the new page ..-->
<!--we use taget attribute after href to open in the other page or source. ..-->

<a href="https://www.instagram.com/" target="blank">
    link to instagram(new_page)
</a>

<!--extra spaces are not included in html ; like in contents so if we give too much space to a line or character it will 
automatically deducted..-->

  </body>
</html>
