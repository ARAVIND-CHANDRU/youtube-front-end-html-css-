
<!DOCTYPE html>
<html>
    <head>
        <title>
            Flexbox.html
        </title>

    </head>
    <body style="padding-bottom: 1000px;">

        <div style="
            margin-top: 30px;

            display: flex;
            flex-direction: row;
            ">
            <div style="background-color: lightblue;" > div 1 text</div>
            <div style="background-color: red;">div 2 <p>aravind.txt</p></div>
        </div>
        <div style="
            display: flex;
            flex-direction: row;
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;
            justify-content: start;
            justify-content: space-between;
            ">
            <div style="background-color: lightblue;
                        width: 100px;" > 100 px</div>
            <div style="background-color: red;
                        width: 100px;">100 px</div>
            <div style="background-color: lightpink;
                        width : 100px">100px</div>
        </div>
         <div style="
            display: flex;
            flex-direction: row;
            margin-top: 30px;
            height: 70px;
            border-width: 1px;
            border-style: solid;
            border-color: gray;
            justify-content: start;
            justify-content: space-between;
            align-items: center;
            ">
            <div style="background-color: lightblue;
                        width: 100px;" > 100 px</div>
            <div style="background-color: red;
                        width: 100px;">100 px</div>
            <div style="background-color: lightpink;
                        width : 100px">100px</div>
        </div>

    </body>

</html>
